<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>🏍️ Bike Racing Game</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
    touch-action: none;
}

#game {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background: #1b7a1b;
}

/* Road */
#road {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: min(75vw, 500px);
    height: 100%;
    background: #444;
    border-left: 8px solid white;
    border-right: 8px solid white;
    overflow: hidden;
}

/* Road lane lines */
.lane {
    position: absolute;
    width: 7px;
    height: 70px;
    background: white;
    left: 33.33%;
}

.lane2 {
    position: absolute;
    width: 7px;
    height: 70px;
    background: white;
    left: 66.66%;
}

/* Bike */
#bike {
    position: absolute;
    width: 55px;
    height: 95px;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
}

.bike-body {
    position: absolute;
    width: 28px;
    height: 58px;
    background: #e60000;
    border-radius: 14px;
    left: 14px;
    top: 18px;
}

.bike-seat {
    position: absolute;
    width: 23px;
    height: 25px;
    background: #111;
    border-radius: 10px;
    left: 16px;
    top: 25px;
}

.wheel {
    position: absolute;
    width: 18px;
    height: 30px;
    background: #111;
    border-radius: 50%;
    left: 19px;
}

.front-wheel {
    top: 0;
}

.back-wheel {
    bottom: 0;
}

.light {
    position: absolute;
    width: 13px;
    height: 13px;
    background: yellow;
    border-radius: 50%;
    left: 21px;
    top: 12px;
}

/* Enemy */
.enemy {
    position: absolute;
    width: 55px;
    height: 85px;
    background: #0066ff;
    border-radius: 10px;
    z-index: 5;
}

.enemy::before {
    content: "";
    position: absolute;
    width: 35px;
    height: 25px;
    background: #9ee7ff;
    left: 10px;
    top: 10px;
    border-radius: 5px;
}

.enemy::after {
    content: "";
    position: absolute;
    width: 40px;
    height: 12px;
    background: #111;
    left: 7px;
    bottom: 10px;
    border-radius: 5px;
}

/* Coin */
.coin {
    position: absolute;
    width: 30px;
    height: 30px;
    background: gold;
    border: 4px solid #ff9900;
    border-radius: 50%;
    z-index: 4;
    box-shadow: 0 0 10px yellow;
}

/* Score */
#scoreBox {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 100;
    color: white;
    font-size: 20px;
    font-weight: bold;
    background: rgba(0,0,0,.55);
    padding: 10px 15px;
    border-radius: 10px;
}

#speedBox {
    position: fixed;
    top: 65px;
    left: 15px;
    z-index: 100;
    color: white;
    font-size: 16px;
    background: rgba(0,0,0,.55);
    padding: 7px 12px;
    border-radius: 8px;
}

/* Start screen */
#startScreen,
#gameOver {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    z-index: 200;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
}

#gameOver {
    display: none;
}

h1 {
    font-size: 42px;
    color: #00ffcc;
    margin-bottom: 15px;
}

button {
    border: none;
    padding: 15px 30px;
    font-size: 20px;
    font-weight: bold;
    border-radius: 12px;
    background: #00d9ff;
    color: #111;
    margin-top: 20px;
}

/* Mobile controls */
#controls {
    position: fixed;
    bottom: 20px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 25px;
    z-index: 150;
}

.controlBtn {
    width: 80px;
    height: 65px;
    border-radius: 18px;
    background: rgba(255,255,255,.3);
    color: white;
    font-size: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
}

/* Desktop */
@media (min-width: 700px) {
    #controls {
        display: none;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="road">

        <div class="lane" id="line1"></div>
        <div class="lane2" id="line2"></div>

        <div id="bike">
            <div class="wheel front-wheel"></div>
            <div class="light"></div>
            <div class="bike-body"></div>
            <div class="bike-seat"></div>
            <div class="wheel back-wheel"></div>
        </div>

    </div>

    <div id="scoreBox">
        🏆 Score: <span id="score">0</span>
    </div>

    <div id="speedBox">
        🚀 Speed: <span id="speed">5</span>
    </div>

</div>


<!-- Start -->
<div id="startScreen">
    <h1>🏍️ BIKE RACE</h1>

    <p>Use ← → keys or mobile buttons</p>
    <p>Avoid cars and collect coins!</p>

    <button onclick="startGame()">START GAME</button>
</div>


<!-- Game Over -->
<div id="gameOver">
    <h1>💥 GAME OVER</h1>

    <p>Your Score: <span id="finalScore">0</span></p>

    <button onclick="restartGame()">🔄 PLAY AGAIN</button>
</div>


<!-- Controls -->
<div id="controls">
    <div class="controlBtn" id="leftBtn">⬅️</div>
    <div class="controlBtn" id="rightBtn">➡️</div>
</div>


<script>

const road = document.getElementById("road");
const bike = document.getElementById("bike");

const scoreText = document.getElementById("score");
const speedText = document.getElementById("speed");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOver");

const finalScore = document.getElementById("finalScore");

const line1 = document.getElementById("line1");
const line2 = document.getElementById("line2");

let gameRunning = false;

let score = 0;
let speed = 5;

let bikeX = 0;

let enemies = [];
let coins = [];

let roadLinesY = 0;

let enemyTimer = 0;
let coinTimer = 0;

let animation;


/* Start Game */
function startGame() {

    gameRunning = true;

    score = 0;
    speed = 5;

    scoreText.innerText = score;
    speedText.innerText = speed;

    enemies.forEach(e => e.remove());
    coins.forEach(c => c.remove());

    enemies = [];
    coins = [];

    startScreen.style.display = "none";
    gameOverScreen.style.display = "none";

    bikeX = road.clientWidth / 2 - bike.offsetWidth / 2;

    bike.style.left = bikeX + "px";

    animation = requestAnimationFrame(gameLoop);
}


/* Restart */
function restartGame() {
    startGame();
}


/* Keyboard */
document.addEventListener("keydown", function(e) {

    if (!gameRunning) return;

    if (e.key === "ArrowLeft" || e.key === "a") {
        moveLeft();
    }

    if (e.key === "ArrowRight" || e.key === "d") {
        moveRight();
    }

});


/* Move Left */
function moveLeft() {

    if (!gameRunning) return;

    bikeX -= 35;

    if (bikeX < 5) {
        bikeX = 5;
    }

    bike.style.left = bikeX + "px";
}


/* Move Right */
function moveRight() {

    if (!gameRunning) return;

    bikeX += 35;

    let maxX = road.clientWidth - bike.offsetWidth - 5;

    if (bikeX > maxX) {
        bikeX = maxX;
    }

    bike.style.left = bikeX + "px";
}


/* Mobile buttons */
document.getElementById("leftBtn")
.addEventListener("touchstart", function(e) {
    e.preventDefault();
    moveLeft();
});

document.getElementById("rightBtn")
.addEventListener("touchstart", function(e) {
    e.preventDefault();
    moveRight();
});


/* Also mouse click */
document.getElementById("leftBtn")
.addEventListener("click", moveLeft);

document.getElementById("rightBtn")
.addEventListener("click", moveRight);


/* Create Enemy */
function createEnemy() {

    const enemy = document.createElement("div");

    enemy.className = "enemy";

    let lanes = [
        road.clientWidth * 0.17,
        road.clientWidth * 0.50,
        road.clientWidth * 0.83
    ];

    let lane = lanes[Math.floor(Math.random() * lanes.length)];

    enemy.style.left =
        (lane - 27) + "px";

    enemy.style.top = "-100px";

    road.appendChild(enemy);

    enemies.push(enemy);
}


/* Create Coin */
function createCoin() {

    const coin = document.createElement("div");

    coin.className = "coin";

    let x =
        Math.random() *
        (road.clientWidth - 40);

    coin.style.left = x + "px";

    coin.style.top = "-50px";

    road.appendChild(coin);

    coins.push(coin);
}


/* Collision */
function collision(a, b) {

    const r1 = a.getBoundingClientRect();
    const r2 = b.getBoundingClientRect();

    return !(
        r1.right < r2.left ||
        r1.left > r2.right ||
        r1.bottom < r2.top ||
        r1.top > r2.bottom
    );
}


/* Game Over */
function endGame() {

    gameRunning = false;

    cancelAnimationFrame(animation);

    finalScore.innerText = score;

    gameOverScreen.style.display = "flex";
}


/* Main Game Loop */
function gameLoop() {

    if (!gameRunning) return;


    /* Moving road */
    roadLinesY += speed;

    if (roadLinesY > 70) {
        roadLinesY = 0;
    }

    line1.style.top = roadLinesY + "px";
    line2.style.top = roadLinesY + "px";


    /* Enemy spawn */
    enemyTimer++;

    if (enemyTimer > 80) {

        createEnemy();

        enemyTimer = 0;
    }


    /* Coin spawn */
    coinTimer++;

    if (coinTimer > 120) {

        createCoin();

        coinTimer = 0;
    }


    /* Move enemies */
    enemies.forEach((enemy, index) => {

        let y = parseFloat(enemy.style.top);

        y += speed;

        enemy.style.top = y + "px";


        /* Collision */
        if (collision(bike, enemy)) {

            endGame();

            return;
        }


        /* Remove */
        if (y > road.clientHeight + 100) {

            enemy.remove();

            enemies.splice(index, 1);

            score++;

            scoreText.innerText = score;
        }

    });


    /* Move coins */
    coins.forEach((coin, index) => {

        let y = parseFloat(coin.style.top);

        y += speed;

        coin.style.top = y + "px";


        /* Collect coin */
        if (collision(bike, coin)) {

            coin.remove();

            coins.splice(index, 1);

            score += 10;

            scoreText.innerText = score;
        }


        /* Remove */
        else if (y > road.clientHeight + 50) {

            coin.remove();

            coins.splice(index, 1);
        }

    });


    /* Increase speed */
    if (score > 0 && score % 20 === 0) {

        speed = 5 + Math.floor(score / 20);

        if (speed > 15) {
            speed = 15;
        }

        speedText.innerText = speed;
    }


    animation = requestAnimationFrame(gameLoop);
}

</script>

</body>
</html>
